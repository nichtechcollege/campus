<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Portal - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="menu-icon" onclick="toggleMenu()">☰</div>
    <h2>Nichtech</h2>
  </header>

  <!-- MENU -->
  <nav id="menu" class="menu">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="courses.html">Courses</a>
    <a href="apply.html">Apply</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
    <a href="portal.html">Student Portal</a>
  </nav>

  <!-- LOGIN CARD -->
  <section class="card login-card">

    <h2>🎓 Student Portal</h2>

    <p class="subtitle">Login to access your dashboard</p>

    <form id="loginForm">

      <input
        type="text"
        id="studentNo"
        placeholder="Student Number"
        autocomplete="username"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton" class="primary-btn">
        Login
      </button>

    </form>

    <p id="message" class="error" role="status" aria-live="polite"></p>

  </section>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 Nichtech Technologies Training College</p>
  </footer>

  <script>

    // GOOGLE APPS SCRIPT WEB APP URL - VERSION 38
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbwM5dwST8GJ-1CyWcqP_59FICBw_QPOaNeD_sLSUuZ_fqc8nrQJ_wKhyLH6KWepbuLjpA/exec";


    // MENU
    function toggleMenu() {
      document.getElementById("menu").classList.toggle("show");
    }

    document.querySelectorAll("#menu a").forEach(function(link) {
      link.addEventListener("click", function() {
        document.getElementById("menu").classList.remove("show");
      });
    });


    // STUDENT LOGIN USING JSONP
    document.getElementById("loginForm").addEventListener("submit", function(event) {

      event.preventDefault();

      const studentNo =
        document.getElementById("studentNo").value.trim();

      const password =
        document.getElementById("password").value;

      const message =
        document.getElementById("message");

      const loginButton =
        document.getElementById("loginButton");


      if (!studentNo || !password) {

        message.style.color = "red";

        message.textContent =
          "Please enter your student number and password.";

        return;

      }


      message.style.color = "#0b5e2b";

      message.textContent = "Logging in...";

      loginButton.disabled = true;

      loginButton.textContent = "Please wait...";


      // UNIQUE CALLBACK
      const callbackName =
        "nichtechLoginCallback_" +
        Date.now() + "_" +
        Math.floor(Math.random() * 100000);


      const script = document.createElement("script");


      // TIMEOUT
      const timeout = window.setTimeout(function() {

        cleanup();

        message.style.color = "red";

        message.textContent =
          "The request timed out. Please try again.";

        resetButton();

      }, 20000);


      // CLEANUP
      function cleanup() {

        window.clearTimeout(timeout);

        script.remove();

        try {

          delete window[callbackName];

        } catch (error) {

          window[callbackName] = undefined;

        }

      }


      // RESET BUTTON
      function resetButton() {

        loginButton.disabled = false;

        loginButton.textContent = "Login";

      }


      // LOGIN RESPONSE
      window[callbackName] = function(data) {

        cleanup();


        if (
          data &&
          data.success === true &&
          data.status === "success"
        ) {

          // SAVE STUDENT INFORMATION
          localStorage.setItem(
            "studentData",
            JSON.stringify(data)
          );

          // OPEN DASHBOARD
          window.location.href = "dashboard.html";

          return;

        }


        message.style.color = "red";

        message.textContent =
          data && data.message
            ? data.message
            : "Invalid student number or password.";

        resetButton();

      };


      // CONNECTION ERROR
      script.onerror = function() {

        cleanup();

        message.style.color = "red";

        message.textContent =
          "Unable to connect to the student portal. Please try again.";

        resetButton();

      };


      // BUILD LOGIN REQUEST
      const url =
        SCRIPT_URL +
        "?studentNo=" + encodeURIComponent(studentNo) +
        "&password=" + encodeURIComponent(password) +
        "&callback=" + encodeURIComponent(callbackName);


      script.src = url;

      document.body.appendChild(script);

    });

  </script>

</body>
</html>
