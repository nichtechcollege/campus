```
<h2>🎓 Student Portal</h2>

<p class="subtitle">Login to access your dashboard</p>

<form id="loginForm">
  <input
    type="text"
    id="studentNo"
    placeholder="Student Number"
    autocomplete="username"
    required
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password"
    required
  >

  <button type="submit" id="loginButton" class="primary-btn">
    Login
  </button>
</form>

<p id="message" class="error" role="status" aria-live="polite"></p>
```

  </section>

  <script>
    // GOOGLE APPS SCRIPT WEB APP URL
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbxjaw0XrBX3wyjw_a9HMNtsYthJes--1Os6uh1YFSPfw-FgCblFd7oBT-WiRCHPnblYzA/exec";

    // MENU
    function toggleMenu() {
      document.getElementById("menu").classList.toggle("show");
    }

    document.querySelectorAll("#menu a").forEach(function(link) {
      link.addEventListener("click", function() {
        document.getElementById("menu").classList.remove("show");
      });
    });

    // STUDENT LOGIN
    document.getElementById("loginForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      const studentNo = document.getElementById("studentNo").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");
      const loginButton = document.getElementById("loginButton");

      if (!studentNo || !password) {
        message.style.color = "red";
        message.textContent = "Please enter your student number and password.";
        return;
      }

      message.style.color = "#0b5e2b";
      message.textContent = "Logging in...";
      loginButton.disabled = true;
      loginButton.textContent = "Please wait...";

      try {
        const url = SCRIPT_URL +
          "?studentNo=" + encodeURIComponent(studentNo) +
          "&password=" + encodeURIComponent(password);

        const response = await fetch(url);
        if (!response.ok) {
          throw new Error("The server returned an error.");
        }

        const data = await response.json();

        if (data.status === "success") {
          localStorage.setItem("studentData", JSON.stringify(data));
          window.location.href = "dashboard.html";
        } else {
          message.style.color = "red";
          message.textContent = data.message || "Invalid Student Number or Password.";
        }

      } catch (error) {
        console.error("Student login error:", error);
        message.style.color = "red";
        message.textContent =
          "Unable to connect to the student portal. Please check your connection and try again.";
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Login";
      }
    });
  </script>
